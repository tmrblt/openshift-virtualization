# Credential: provisioner-user
- name: Provision Namespace and Database VM
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    actual_user: "{{ awx_user_name }}"
    billing_group: "group1"
    template_namespace: "template"
    ssh_user: "fedora"

  tasks:

    # ============================================================
    # VALIDATION
    # ============================================================

    - name: Validate actual user
      ansible.builtin.fail:
        msg: "User identity could not be determined."
      when:
        - actual_user is not defined or actual_user | trim == ""

    - name: Validate project name
      ansible.builtin.fail:
        msg: "project_name is required."
      when:
        - project_name is not defined or project_name | trim == ""

    - name: Validate database type
      ansible.builtin.fail:
        msg: >-
          Invalid dbtype '{{ dbtype | default("undefined") }}'.
          Allowed values: postgresql13, mongodb83
      when:
        - dbtype is not defined or dbtype not in ['postgresql13', 'mongodb83']


    # ============================================================
    # NAMESPACE
    # ============================================================

    - name: Create isolated namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ project_name }}"
            labels:
              billing-group: "{{ billing_group }}"
              provisioned-via: AAP-Portal
            annotations:
              openshift.io/requester: "{{ actual_user }}"


    # ============================================================
    # RESOURCE GUARDRAILS
    # ============================================================

    - name: Apply ResourceQuota
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ResourceQuota
          metadata:
            name: default-quota
            namespace: "{{ project_name }}"
          spec:
            hard:
              cpu: "10"
              memory: 40Gi
              requests.storage: 100Gi
              count/virtualmachines.kubevirt.io: "2"

    - name: Apply LimitRange
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: LimitRange
          metadata:
            name: default-limits
            namespace: "{{ project_name }}"
          spec:
            limits:
              - type: Container
                default:
                  cpu: "2"
                  memory: 4Gi
                defaultRequest:
                  cpu: "1"
                  memory: 2Gi


    # ============================================================
    # PROJECT RBAC
    # ============================================================

    - name: Grant project admin permissions to requester
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: project-admin-binding
            namespace: "{{ project_name }}"
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: user-project-admin
          subjects:
            - kind: User
              name: "{{ actual_user }}"
              apiGroup: rbac.authorization.k8s.io

    - name: Grant project viewer permissions to billing group
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: project-group-viewer-binding
            namespace: "{{ project_name }}"
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: user-project-viewer
          subjects:
            - kind: Group
              name: "{{ billing_group }}"
              apiGroup: rbac.authorization.k8s.io


    # ============================================================
    # SELECT DATABASE TEMPLATE
    # ============================================================

    - name: Select database template
      ansible.builtin.set_fact:
        selected_template: >-
          {{
            'postgresql-13'
            if dbtype == 'postgresql13'
            else 'mongodb-83'
          }}


    # ============================================================
    # READ OPENSHIFT TEMPLATE
    # ============================================================

    - name: Read selected OpenShift template
      kubernetes.core.k8s_info:
        api_version: template.openshift.io/v1
        kind: Template
        namespace: "{{ template_namespace }}"
        name: "{{ selected_template }}"
      register: template_info

    - name: Fail if template does not exist
      ansible.builtin.fail:
        msg: >-
          Template '{{ selected_template }}' was not found
          in namespace '{{ template_namespace }}'.
      when:
        - template_info.resources | length == 0


    # ============================================================
    # GENERATE VM NAME
    # ============================================================

    - name: Generate VM name suffix
      ansible.builtin.set_fact:
        vm_suffix: >-
          {{
            lookup(
              'ansible.builtin.password',
              '/dev/null',
              length=5,
              chars=['ascii_lowercase', 'digits']
            )
          }}

    - name: Build VM name
      ansible.builtin.set_fact:
        vm_name: "{{ selected_template }}-{{ vm_suffix }}"


    # ============================================================
    # EXTRACT VM FROM TEMPLATE
    # ============================================================

    - name: Extract VirtualMachine definition from template
      ansible.builtin.set_fact:
        generated_vm: "{{ template_info.resources[0].objects[0] }}"

    - name: Replace template NAME parameter
      ansible.builtin.set_fact:
        generated_vm: >-
          {{
            generated_vm
            | to_json
            | replace('${NAME}', vm_name)
            | from_json
          }}


    # ============================================================
    # GENERATE SSH PASSWORD
    # ============================================================

    - name: Generate SSH password
      ansible.builtin.set_fact:
        ssh_password: >-
          {{
            lookup(
              'ansible.builtin.password',
              '/dev/null',
              length=20,
              chars=['ascii_letters', 'digits']
            )
          }}
      no_log: true


    # ============================================================
    # CLOUD-INIT
    # ============================================================

    - name: Build cloud-init configuration
      ansible.builtin.set_fact:
        cloud_init_userdata: |
          #cloud-config
          ssh_pwauth: true
          chpasswd:
            expire: false
            users:
              - name: {{ ssh_user }}
                password: "{{ ssh_password }}"
                type: text
          runcmd:
            - systemctl enable --now sshd
            - systemctl restart sshd
      no_log: true

    - name: Create cloud-init Secret
      kubernetes.core.k8s:
        state: present
        impersonate_user: "{{ actual_user }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ vm_name }}-cloudinit"
            namespace: "{{ project_name }}"
            labels:
              app: "{{ vm_name }}"
              database-type: "{{ dbtype }}"
              provisioned-via: AAP-Portal
            annotations:
              openshift.io/requester: "{{ actual_user }}"
          type: Opaque
          stringData:
            userdata: "{{ cloud_init_userdata }}"
      no_log: true


    # ============================================================
    # BUILD FINAL VM DEFINITION
    # ============================================================

    - name: Build final VM definition
      ansible.builtin.set_fact:
        final_vm: >-
          {{
            generated_vm
            | combine(
                {
                  'metadata':
                    generated_vm.metadata
                    | combine(
                        {
                          'namespace': project_name,

                          'annotations':
                            (
                              generated_vm.metadata.annotations
                              | default({})
                            )
                            | combine(
                                {
                                  'openshift.io/requester': actual_user,
                                  'aap.openshift.io/requested-by': actual_user
                                }
                              ),

                          'labels':
                            (
                              generated_vm.metadata.labels
                              | default({})
                            )
                            | combine(
                                {
                                  'vm.kubevirt.io/template.namespace':
                                    template_namespace
                                }
                              )
                        },
                        recursive=True
                      ),

                  'spec':
                    generated_vm.spec
                    | combine(
                        {
                          'template':
                            generated_vm.spec.template
                            | combine(
                                {
                                  'spec':
                                    generated_vm.spec.template.spec
                                    | combine(
                                        {
                                          'domain':
                                            generated_vm.spec.template.spec.domain
                                            | combine(
                                                {
                                                  'devices':
                                                    generated_vm.spec.template.spec.domain.devices
                                                    | combine(
                                                        {
                                                          'disks':
                                                            generated_vm.spec.template.spec.domain.devices.disks
                                                            +
                                                            [
                                                              {
                                                                'name': 'cloudinitdisk',
                                                                'disk': {
                                                                  'bus': 'virtio'
                                                                }
                                                              }
                                                            ]
                                                        },
                                                        recursive=True
                                                      )
                                                },
                                                recursive=True
                                              ),

                                          'volumes':
                                            generated_vm.spec.template.spec.volumes
                                            +
                                            [
                                              {
                                                'name': 'cloudinitdisk',
                                                'cloudInitNoCloud': {
                                                  'userDataSecretRef': {
                                                    'name':
                                                      vm_name ~ '-cloudinit'
                                                  }
                                                }
                                              }
                                            ]
                                        },
                                        recursive=True
                                      )
                                },
                                recursive=True
                              )
                        },
                        recursive=True
                      )
                },
                recursive=True
              )
          }}
      no_log: true


    # ============================================================
    # CREATE VM AS ACTUAL USER
    # ============================================================

    - name: Create database VM as requesting user
      kubernetes.core.k8s:
        state: present
        impersonate_user: "{{ actual_user }}"
        definition: "{{ final_vm }}"
      no_log: true


    # ============================================================
    # WAIT FOR VM
    # ============================================================

    - name: Wait until VM is ready
      kubernetes.core.k8s_info:
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        namespace: "{{ project_name }}"
        name: "{{ vm_name }}"
      register: vm_status
      until:
        - vm_status.resources | length > 0
        - vm_status.resources[0].status is defined
        - vm_status.resources[0].status.ready | default(false) | bool
      retries: 60
      delay: 10

    - name: Wait until VMI is running
      kubernetes.core.k8s_info:
        api_version: kubevirt.io/v1
        kind: VirtualMachineInstance
        namespace: "{{ project_name }}"
        name: "{{ vm_name }}"
      register: vmi_status
      until:
        - vmi_status.resources | length > 0
        - vmi_status.resources[0].status.phase | default('') == 'Running'
        - vmi_status.resources[0].status.nodeName | default('') | length > 0
      retries: 60
      delay: 5

    - name: Capture VMI information
      ansible.builtin.set_fact:
        vm_node_name: "{{ vmi_status.resources[0].status.nodeName }}"
        vm_internal_ip: >-
          {{
            vmi_status.resources[0].status.interfaces[0].ipAddress
            | default('N/A')
          }}


    # ============================================================
    # SSH NODEPORT SERVICE
    # ============================================================

    - name: Create SSH NodePort Service
      kubernetes.core.k8s:
        state: present
        impersonate_user: "{{ actual_user }}"
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: "{{ vm_name }}-ssh"
            namespace: "{{ project_name }}"
            labels:
              app: "{{ vm_name }}"
              database-type: "{{ dbtype }}"
              provisioned-via: AAP-Portal
            annotations:
              openshift.io/requester: "{{ actual_user }}"
          spec:
            type: NodePort
            selector:
              kubevirt.io/domain: "{{ vm_name }}"
            ports:
              - name: ssh
                protocol: TCP
                port: 22
                targetPort: 22


    # ============================================================
    # READ SERVICE INFORMATION
    # ============================================================

    - name: Read SSH Service
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Service
        namespace: "{{ project_name }}"
        name: "{{ vm_name }}-ssh"
      register: ssh_service

    - name: Capture SSH Service information
      ansible.builtin.set_fact:
        ssh_cluster_ip: "{{ ssh_service.resources[0].spec.clusterIP }}"
        ssh_node_port: "{{ ssh_service.resources[0].spec.ports[0].nodePort }}"


    # ============================================================
    # GET VM NODE ADDRESS
    # ============================================================

    - name: Read VM node
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Node
        name: "{{ vm_node_name }}"
      register: vm_node

    - name: Capture node InternalIP
      ansible.builtin.set_fact:
        ssh_node_ip: >-
          {{
            (
              vm_node.resources[0].status.addresses
              | selectattr('type', 'equalto', 'InternalIP')
              | map(attribute='address')
              | list
            )[0]
          }}


    # ============================================================
    # FINAL OUTPUT
    # ============================================================

    - name: Display database VM access information
      ansible.builtin.debug:
        msg:
          - "======================================================"
          - " DATABASE VM PROVISIONING COMPLETED"
          - "======================================================"
          - "Requested By   : {{ actual_user }}"
          - "Project        : {{ project_name }}"
          - "Database Type  : {{ dbtype }}"
          - "Template       : {{ selected_template }}"
          - "VM Name        : {{ vm_name }}"
          - "VM Internal IP : {{ vm_internal_ip }}"
          - "ClusterIP      : {{ ssh_cluster_ip }}"
          - "Node           : {{ vm_node_name }}"
          - "Node IP        : {{ ssh_node_ip }}"
          - "NodePort       : {{ ssh_node_port }}"
          - "SSH User       : {{ ssh_user }}"
          - "SSH Password   : {{ ssh_password }}"
          - "SSH Address    : {{ ssh_node_ip }}:{{ ssh_node_port }}"
          - "SSH Command    : ssh {{ ssh_user }}@{{ ssh_node_ip }} -p {{ ssh_node_port }}"
          - "======================================================"
